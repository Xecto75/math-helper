# Render blueprint — the API half of the app (the Express server that talks to
# Anthropic and enforces the quota). The site itself is static and goes to
# Vercel; only this needs a real Node process.
#
# On the free plan the service sleeps after 15 minutes without traffic, so the
# first visitor after a quiet spell waits ~50s for it to wake. Everything after
# that is normal speed.
services:
  - type: web
    name: math-engine-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Set these in the Render dashboard — never in this file, it is in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PREMIUM_EMAILS
        sync: false
      - key: FREE_LESSON_LIMIT
        value: "5"
